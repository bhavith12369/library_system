<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Issues</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Library Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/books">Books</a>
                <a class="nav-link" href="/issues">My Issues</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>My Book Issues</h1>
        <a href="/dashboard" class="btn btn-secondary mb-3">Back to Dashboard</a>
        <a href="/issues/new" class="btn btn-primary mb-3">Issue New Book</a>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Book</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Return Date</th>
                    <th>Fine</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="issue : ${issues}">
                    <td th:text="${issue.book.title}"></td>
                    <td th:text="${issue.issueDate}"></td>
                    <td th:text="${issue.dueDate}"></td>
                    <td th:text="${issue.returnDate}"></td>
                    <td th:text="${issue.fine}"></td>
                    <td>
                        <form th:if="${issue.returnDate == null}" th:action="@{/issues/{id}/return(id=${issue.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-success">Return</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
