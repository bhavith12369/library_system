<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add New Book | LuminaLibrary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <nav>
        <div class="logo">LuminaLibrary</div>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/books}">Books</a></li>
        </ul>
    </nav>

    <div class="form-container glass animate-fade-in">
        <h2>Add New Book</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Register a new asset to the library collection.</p>
        
        <form th:action="@{/books}" th:object="${book}" method="post">
            <div class="form-group">
                <label for="title">Book Title</label>
                <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="e.g. The Great Gatsby" required>
            </div>
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}" class="form-control" placeholder="e.g. F. Scott Fitzgerald" required>
            </div>
            <div class="form-group">
                <label for="isbn">ISBN Number</label>
                <input type="text" id="isbn" th:field="*{isbn}" class="form-control" placeholder="978-3-16-148410-0" required>
            </div>
            
            <div style="margin-top: 2.5rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Book</button>
                <a th:href="@{/books}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 LuminaLibrary.</p>
    </footer>
</body>
</html>
