<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Issue Book | LuminaLibrary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <nav>
        <div class="logo">LuminaLibrary <span style="font-size: 0.7rem; background: var(--secondary); color: white; padding: 0.1rem 0.4rem; border-radius: 4px; margin-left: 0.5rem;">ADMIN</span></div>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/issues}">Issues</a></li>
        </ul>
    </nav>

    <div class="form-container glass animate-fade-in">
        <h2>Issue a Book</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">As an administrator, you can assign books to students.</p>
        
        <form th:action="@{/issues}" method="post">
            <div class="form-group">
                <label for="bookId">Select Book</label>
                <select id="bookId" name="bookId" class="form-control" style="background: rgba(15, 23, 42, 0.8);" required>
                    <option value="" disabled selected>Choose a book...</option>
                    <option th:each="book : ${books}" th:value="${book.id}" 
                            th:text="${book.title + ' — ' + book.author}"
                            th:selected="${book.id == selectedBookId}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="userId">Select Student</label>
                <select id="userId" name="userId" class="form-control" style="background: rgba(15, 23, 42, 0.8);" required>
                    <option value="" disabled selected>Choose a student...</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name + ' (' + u.email + ')'}"></option>
                </select>
            </div>
            
            <div style="margin-top: 2.5rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1; background: var(--secondary);">Confirm Issue</button>
                <a th:href="@{/issues}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 LuminaLibrary.</p>
    </footer>
</body>
</html>
