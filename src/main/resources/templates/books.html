<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Books Catalog | LuminaLibrary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <nav>
        <div class="logo">LuminaLibrary</div>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/books}">Books</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/users}">Students</a></li>
            <li><a th:href="@{/issues}">Issues</a></li>
        </ul>
    </nav>

    <div style="padding: 3rem 5%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1>Library Catalog</h1>
                <p style="color: var(--text-muted);">Browse and manage the collection of books.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <form th:action="@{/books/search}" method="get" style="display: flex; gap: 0.5rem;">
                    <input type="text" name="query" class="form-control" placeholder="Search title or author..." style="width: 250px;">
                    <button type="submit" class="btn btn-outline">Search</button>
                </form>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/books/new}" class="btn btn-primary">+ Add Book</a>
            </div>
        </div>

        <div class="grid" style="padding: 0;">
            <div th:each="book : ${books}" class="card glass animate-fade-in">
                <div style="display: flex; justify-content: space-between; align-items: start;">
                    <h3 th:text="${book.title}">Book Title</h3>
                    <span th:if="${book.available}" style="background: rgba(34, 197,  green, 0.1); color: var(--success); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700;">AVAILABLE</span>
                    <span th:unless="${book.available}" style="background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700;">ISSUED</span>
                </div>
                <p th:text="${book.author}" style="color: var(--text-muted); margin-bottom: 1rem;">Author Name</p>
                <p th:text="${book.isbn}" style="font-size: 0.8rem; font-family: monospace; color: var(--text-muted);">ISBN</p>
                
                <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                    <form sec:authorize="hasRole('ADMIN')" th:if="${book.available}" th:action="@{/issues/new}" method="get" style="flex: 1;">
                        <input type="hidden" name="bookId" th:value="${book.id}">
                        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 0.875rem; background: var(--secondary);">Issue This Book</button>
                    </form>
                    <div sec:authorize="hasRole('STUDENT')" style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem;">
                        <form th:if="${book.available}" th:action="@{/issues/request}" method="post">
                            <input type="hidden" name="bookId" th:value="${book.id}">
                            <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 0.875rem;">Request to Purchase</button>
                        </form>
                        <div th:unless="${book.available}" style="text-align: center; color: var(--text-muted); font-size: 0.8rem;">
                            Currently checked out
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 LuminaLibrary.</p>
    </footer>
</body>
</html>
