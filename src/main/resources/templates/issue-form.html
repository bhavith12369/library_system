<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Issue Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">Library Management</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/books">Books</a>
                <a class="nav-link" href="/issues">My Issues</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1>Issue Book</h1>
        <a href="/issues" class="btn btn-secondary mb-3">Back to My Issues</a>
        <form th:action="@{/issues}" method="post">
            <div class="mb-3">
                <label for="bookId" class="form-label">Book</label>
                <select class="form-control" id="bookId" name="bookId" required>
                    <option th:each="book : ${books}" th:value="${book.id}" th:text="${book.title + ' by ' + book.author}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Issue Book</button>
        </form>
    </div>
</body>
</html>
