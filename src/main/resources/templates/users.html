<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Students | LuminaLibrary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <nav>
        <div class="logo">LuminaLibrary</div>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/books}">Books</a></li>
            <li><a th:href="@{/users}">Students</a></li>
            <li><a th:href="@{/issues}">Issues</a></li>
        </ul>
    </nav>

    <div style="padding: 3rem 5%;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h1>Student Directory</h1>
                <p style="color: var(--text-muted);">Manage registered students and their access levels.</p>
            </div>
            <a th:href="@{/users/new}" class="btn btn-primary">+ Register Student</a>
        </div>

        <div class="table-container glass">
            <table>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>ID</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.name}" style="font-weight: 600;">Student Name</td>
                        <td th:text="${user.email}" style="color: var(--text-muted);">email@example.com</td>
                        <td>
                            <span th:text="${user.role}" 
                                  th:classappend="${user.role != null && user.role.name() == 'ADMIN' ? 'role-admin' : 'role-student'}"
                                  style="padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                                ROLE
                            </span>
                        </td>
                        <td th:text="${user.id}" style="font-family: monospace; font-size: 0.8rem; color: var(--text-muted);">ID</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 LuminaLibrary.</p>
    </footer>

    <style>
        .role-admin { background: rgba(236, 72, 153, 0.1) !important; color: var(--secondary) !important; }
        .role-student { background: rgba(34, 197, 94, 0.1) !important; color: var(--success) !important; }
    </style>
</body>
</html>
