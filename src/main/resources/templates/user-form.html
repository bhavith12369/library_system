<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Student | LuminaLibrary</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body>
    <nav>
        <div class="logo">LuminaLibrary</div>
        <ul class="nav-links">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/users}">Students</a></li>
        </ul>
    </nav>

    <div class="form-container glass animate-fade-in">
        <h2>Register New Student</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Fill in the details to create a new library account.</p>
        
        <form th:action="@{/users}" th:object="${user}" method="post">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="john@university.edu" required>
            </div>
            <div class="form-group">
                <label for="password">Initial Password</label>
                <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label for="role">Account Role</label>
                <select id="role" th:field="*{role}" class="form-control" style="background: rgba(15, 23, 42, 0.8);">
                    <option th:value="${T(com.example.librarymanagement.entity.User.Role).STUDENT}">STUDENT</option>
                    <option th:value="${T(com.example.librarymanagement.entity.User.Role).ADMIN}">ADMIN</option>
                </select>
            </div>
            
            <div style="margin-top: 2.5rem; display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Create Account</button>
                <a th:href="@{/users}" class="btn btn-outline" style="flex: 1; text-align: center;">Cancel</a>
            </div>
        </form>
    </div>

    <footer>
        <p>&copy; 2024 LuminaLibrary.</p>
    </footer>
</body>
</html>
